// ===== DRAFT SNŮ =====
// Všech 24 týmů se rozpustí do jedné společné zásoby hráčů a hadovitým (snake) způsobem
// se vybírá znovu. Každý tým si vybere 1 brankáře, 4 obránce a 6 útočníků.
// Ty vybíráš za tým, který máš zrovna zvolený v nabídce, ostatní týmy vybírá počítač.
const DRAFT_NEEDS = { G: 1, D: 4, F: 6 };
const DRAFT_ROUNDS = 11;

function startDraftMode() {
    const names = Object.keys(db.teams);
    const myTeam = names[selectedIdx];
    const pool = [];
    const origin = {};
    names.forEach(t => db.teams[t].roster.forEach(p => { pool.push(p); origin[p.n] = db.teams[t].abbr; }));

    draftState = {
        myTeam: myTeam,
        pool: pool,
        origin: origin,
        order: names.slice().sort(() => Math.random() - 0.5),
        picks: {},
        pickNo: 0,
        filter: "ALL",
        log: []
    };
    names.forEach(t => { draftState.picks[t] = []; });
    draftAdvance();
}

function draftTotalPicks() { return draftState.order.length * DRAFT_ROUNDS; }

function draftCurrentTeam() {
    const n = draftState.order.length;
    const round = Math.floor(draftState.pickNo / n);
    const i = draftState.pickNo % n;
    return round % 2 === 0 ? draftState.order[i] : draftState.order[n - 1 - i];
}

function draftNeeds(team) {
    const c = { G: 0, D: 0, F: 0 };
    draftState.picks[team].forEach(p => { c[p.p]++; });
    return { G: DRAFT_NEEDS.G - c.G, D: DRAFT_NEEDS.D - c.D, F: DRAFT_NEEDS.F - c.F };
}

function draftAiPick(team) {
    const need = draftNeeds(team);
    let elig = draftState.pool.filter(p => need[p.p] > 0);
    if (!elig.length) elig = draftState.pool.slice();
    let best = null, bestScore = -Infinity;
    elig.forEach(p => {
        // brankář má velký vliv na obranu, takže si ho AI cení o něco víc
        const score = p.ovr + (p.p === "G" ? 4 : 0) + (Math.random() * 4 - 2);
        if (score > bestScore) { bestScore = score; best = p; }
    });
    return best;
}

function draftMakePick(team, player) {
    const idx = draftState.pool.indexOf(player);
    if (idx === -1) return;
    draftState.pool.splice(idx, 1);
    draftState.picks[team].push(player);
    draftState.pickNo++;
    draftState.log.unshift({ no: draftState.pickNo, team: team, name: player.n, pos: player.p, ovr: Math.round(player.ovr) });
    if (draftState.log.length > 14) draftState.log.length = 14;
}

function draftAdvance() {
    const total = draftTotalPicks();
    while (draftState.pickNo < total) {
        const team = draftCurrentTeam();
        if (team === draftState.myTeam) break;
        draftMakePick(team, draftAiPick(team));
    }
    if (draftState.pickNo >= total) { finishDraft(); return; }
    renderDraft();
}

function draftUserPick(enc) {
    if (!draftState) return;
    const name = decodeURIComponent(enc);
    const p = draftState.pool.find(x => x.n === name);
    if (!p) return;
    if (draftCurrentTeam() !== draftState.myTeam) return;
    if (draftNeeds(draftState.myTeam)[p.p] <= 0) return;
    draftMakePick(draftState.myTeam, p);
    draftAdvance();
}

function draftAutoRest() {
    if (!draftState) return;
    const total = draftTotalPicks();
    while (draftState.pickNo < total) {
        const team = draftCurrentTeam();
        draftMakePick(team, draftAiPick(team));
    }
    finishDraft();
}

function draftSetFilter(f) {
    if (!draftState) return;
    draftState.filter = f;
    renderDraft();
}

function draftCancel() {
    draftState = null;
    render();
}

function finishDraft() {
    const st = draftState;
    const posRank = { F: 0, D: 1, G: 2 };

    Object.keys(st.picks).forEach(t => {
        const rest = st.picks[t].slice().sort((a, b) => b.ovr - a.ovr);
        const take = (pos) => {
            const i = rest.findIndex(p => p.p === pos);
            return i >= 0 ? rest.splice(i, 1)[0] : rest.shift();
        };
        // sestava: brankář, 2 obránci, 3 útočníci
        const roster = [take("G"), take("D"), take("D"), take("F"), take("F"), take("F")];
        // střídačka: nejdřív útočníci, pak obránci
        rest.sort((a, b) => posRank[a.p] - posRank[b.p] || b.ovr - a.ovr);
        roster.push(...rest);

        roster.forEach(p => { delete p.cap; p.energy = 100; });
        db.teams[t].roster = roster;
        ensureCaptain(t);
    });

    db.userTeam = st.myTeam;
    draftState = null;
    save();
    render();
}

function renderDraft() {
    const st = draftState;
    const n = st.order.length;
    const total = draftTotalPicks();
    const round = Math.floor(st.pickNo / n) + 1;

// ===== DOMÁCÍ PROSTŘEDÍ =====
const HOME_BONUS = 0.03; // domácí tým má o 3 % silnější útok i obranu

// Úpravy střelby a zakončení z nastavení hráče platí pro jeho tým doma i venku
function userShotMod(tn) {
    if (tn !== db.userTeam) return 1.0;
    if (db.userShootingStyle === "volume") return 1.35;
    if (db.userShootingStyle === "creativity") return 0.75;
    return 1.0;
}
function userEffMod(tn) {
    if (tn !== db.userTeam) return 1.0;
    if (db.userShootingStyle === "volume") return 0.70;
    if (db.userShootingStyle === "creativity") return 1.45;
    return 1.0;
}

// Je hráčův tým v příštím zápase doma? (základní část podle rozpisu, play-off série: 1. a 3. zápas hraje doma 1. tým)
function userIsHomeNow() {
    if (db.playoffStage === 0) {
        const fx = getFixture(db.userTeam, db.currentRound);
        return fx.home;
    }
    const pair = db.playoffPairs.find(p => p.t1 === db.userTeam || p.t2 === db.userTeam);
    if (!pair) return true;
    const t1Home = seriesT1Home(pair);
    return pair.t1 === db.userTeam ? t1Home : !t1Home;
}

// Play-off hraje série na 3 vítězné zápasy (best-of-5), baráž na 2 vítězné (best-of-3)
function seriesWinsNeeded() { return db.playoffStage === 4 ? 2 : 3; }
function seriesDone(p) { const w = seriesWinsNeeded(); return p.w1 >= w || p.w2 >= w; }
function seriesWinner(p) { return p.w1 >= seriesWinsNeeded() ? p.t1 : p.t2; }

// Kdo hraje doma: play-off 2-2-1 (1. tým doma v zápasech 1, 2, 5), baráž 1-1-1
function seriesT1Home(pair) {
    const g = pair.w1 + pair.w2;
    if (db.playoffStage === 4 || g > 4) return g % 2 === 0;
    return [true, true, false, false, true][g];
}

// Jeden zápas série
function playSeriesGame(pair) {
    const home = seriesT1Home(pair) ? pair.t1 : pair.t2;
    const away = home === pair.t1 ? pair.t2 : pair.t1;
    const w = quickSim(home, away);
    if (w === pair.t1) pair.w1++; else pair.w2++;
}

// ===== FÉROVÉ TREJDY =====
// Hodnota hráče roste exponenciálně s OVR (hvězda je cennější než dva průměrní hráči)
// a mírně se upravuje podle aktuální formy (val se mění po každém zápase).
function tradeValue(p) {
    const form = Math.max(0.92, Math.min(1.08, p.val / (p.ovr * 10000)));
    return Math.pow(1.07, p.ovr - 60) * 100 * form;
}

function tradeOptionLabel(p) {
    return `${p.n} (${p.p}, ${Math.round(p.ovr)} OVR) - hodnota ${Math.round(tradeValue(p))}`;
}

// ratio = hodnota toho, co dává hráč / hodnota toho, co chce dostat
function evaluateTrade(myP, theirP) {
    const ratio = tradeValue(myP) / tradeValue(theirP);
    if (ratio >= 1.15) return { accept: true, ratio, color: "#f59e0b", text: "AI to přijme – ale přeplácíš, tvůj hráč má výrazně vyšší hodnotu." };
    if (ratio >= 0.85) return { accept: true, ratio, color: "#22c55e", text: "Výměna je v pořádku – AI by ji přijalo." };
    if (ratio >= 0.70) return { accept: false, ratio, color: "#f59e0b", text: "Skoro – AI chce o něco víc. Zkus lepšího hráče nebo levnějšího na jejich straně." };
    return { accept: false, ratio, color: "#ef4444", text: "AI odmítne – tvůj hráč má příliš nízkou hodnotu." };
}

function updateTradeVerdict() {
    const box = document.getElementById('trade-verdict');
    if (!box) return;
    const partner = document.getElementById('trade-partner-select').value;
    const myName = document.getElementById('trade-my-player').value;
    const theirName = document.getElementById('trade-their-player').value;
    if (!partner || !myName || !theirName) { box.innerHTML = ""; return; }
    const myP = db.teams[db.userTeam].roster.find(p => p.n === myName);
    const theirP = db.teams[partner].roster.find(p => p.n === theirName);
    if (!myP || !theirP) { box.innerHTML = ""; return; }
    if (myP.p !== theirP.p) { box.innerHTML = `<span style="color:#ef4444;">Nelze měnit různé pozice (${myP.p} za ${theirP.p}).</span>`; return; }
    const ev = evaluateTrade(myP, theirP);
    box.innerHTML = `<div style="font-size:12px; color:#64748b;">Tvůj hráč: <b>${Math.round(tradeValue(myP))}</b> &nbsp;|&nbsp; Požadovaný: <b>${Math.round(tradeValue(theirP))}</b></div>
        <div style="color:${ev.color}; margin-top:4px;">${ev.text}</div>`;
}

// po výměně: nikdo nenese kapitánskou pásku do cizího týmu
function afterTrade(teamA, teamB, pA, pB) {
    delete pA.cap; delete pB.cap;
    ensureCaptain(teamA);
    ensureCaptain(teamB);
}

// najde férovou protihodnotu k hráči: stejná pozice, hodnota v rozmezí minRatio..maxRatio
function findFairCounterpart(player, fromTeam, minRatio, maxRatio) {
    const v = tradeValue(player);
    const cands = db.teams[fromTeam].roster.filter(c => {
        if (c.p !== player.p) return false;
        const r = tradeValue(c) / v;
        return r >= minRatio && r <= maxRatio;
    });
    if (!cands.length) return null;
    return cands[Math.floor(Math.random() * cands.length)];
}

// ===== BARÁŽ O EXTRALIGU =====
// 1. z 1. ligy postupuje přímo, poslední z Extraligy sestupuje přímo.
// O jedno další místo hraje 13. tým Extraligy proti 2. týmu 1. ligy (série na 2 vítězné).
function leagueTable(lNum) {
    return getLeagueTeams(lNum).map(n => ({ n, ...db.teams[n] }))
        .sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga))
        .map(x => x.n);
}

function barazInfo() {
    const l1 = leagueTable(1), l2 = leagueTable(2);
    if (l1.length < 4 || l2.length < 3) return null;
    return { t1: l1[l1.length - 2], t2: l2[1], directRel: l1[l1.length - 1], directProm: l2[0] };
}

function simulateBaraz() {
    if (db.baraz && db.baraz.winner) return;
    const info = barazInfo();
    if (!info) return;
    const pair = { t1: info.t1, t2: info.t2, w1: 0, w2: 0 };
    const savedStage = db.playoffStage;
    db.playoffStage = 4;
    while (pair.w1 < 2 && pair.w2 < 2) playSeriesGame(pair);
    db.playoffStage = savedStage;
    db.baraz = { t1: pair.t1, t2: pair.t2, w1: pair.w1, w2: pair.w2, winner: pair.w1 >= 2 ? pair.t1 : pair.t2 };
}

// hráč je v baráži -> odehraje ji sám (stage 4)
function startBarazStage(info) {
    db.baraz = { t1: info.t1, t2: info.t2, w1: 0, w2: 0, winner: null };
    db.playoffStage = 4;
    db.playoffPairs = [{ t1: info.t1, t2: info.t2, w1: 0, w2: 0 }];
    db.playoffWinners = [];
    save();
}

function finishBarazStage() {
    const p = db.playoffPairs[0];
    db.baraz = { t1: p.t1, t2: p.t2, w1: p.w1, w2: p.w2, winner: p.w1 >= 2 ? p.t1 : p.t2 };
}

function runPlayerSearch() {
    const box = document.getElementById('player-search-results');
    if (!box) return;
    const inp = document.getElementById('player-search-input');
    const lg = document.getElementById('player-search-league');
    const ps = document.getElementById('player-search-pos');
    const q = normSearch((inp && inp.value) || '').trim();
    const league = (lg && lg.value) || 'all';
    const pos = (ps && ps.value) || 'all';
    const canTrade = db.enableTrades && db.playoffStage === 0;

    const list = [];
    Object.keys(db.teams).forEach(tn => {
        const t = db.teams[tn];
        if (league !== 'all' && String(t.league) !== league) return;
        t.roster.forEach((p, idx) => {
            if (pos !== 'all' && p.p !== pos) return;
            const key = normSearch(p.n);
            if (q && key.indexOf(q) === -1) return;
            list.push({ p, t, tn, idx, key, pts: p.g + p.a, poPts: p.po_g + p.po_a });
        });
    });

    // nejdřív shoda na začátku jména/příjmení, pak body (základní část + play-off), pak OVR
    const starts = (x) => {
        if (!q) return 0;
        return x.key.split(/[\s.]+/).filter(Boolean).some(w => w.indexOf(q) === 0) ? 1 : 0;
    };
    list.sort((a, b) => starts(b) - starts(a) || (b.pts + b.poPts) - (a.pts + a.poPts) || b.p.ovr - a.p.ovr);

    if (!list.length) {
        box.innerHTML = `<div style="text-align:center; padding:30px; color:#64748b;">Nikdo takový nebyl nalezen.</div>`;
        return;
    }

    const LIMIT = q ? 40 : 20;
    const shown = list.slice(0, LIMIT);
    const rows = shown.map(x => {
        const p = x.p, t = x.t;
        const isUser = x.tn === db.userTeam;
        let statCells;
        if (p.p === 'G') {
            const sv = t.shotsAgainst > 0 ? ((1 - t.ga / t.shotsAgainst) * 100).toFixed(1) + ' %' : '—';
            statCells = `<td colspan="4" style="color:#64748b; font-size:12px;">čistá konta ${p.so} • úspěšnost ${sv}</td>`;
        } else {
            statCells = `<td>${p.g}</td><td>${p.a}</td><td><b>${x.pts}</b></td><td style="color:#8b5cf6;">${x.poPts}</td>`;
        }
        const action = (canTrade && !isUser)
            ? `<button class="btn" style="width:auto; padding:4px 10px; font-size:11px; background:#c2410c; color:#fff;" onclick="openTradeWith('${encodeURIComponent(x.tn)}','${encodeURIComponent(p.n)}')">TRADE</button>`
            : '';
        return `<tr class="${isUser ? 'highlight' : ''}">
            <td style="text-align:left;">${plink(p.n, t.logo)}</td>
            <td>${t.abbr} <small style="color:#94a3b8;">${t.league === 1 ? 'E' : '1.L'}</small></td>
            <td>${p.p}</td><td>${Math.round(p.ovr)}</td><td>${p.gp}</td>
            ${statCells}
            <td>${action}</td></tr>`;
    }).join('');

    const info = q
        ? `Nalezeno ${list.length} hráčů${list.length > shown.length ? ' (zobrazeno prvních ' + shown.length + ', zpřesni hledání)' : ''}`
        : 'Nejlepší bodovači – začni psát jméno a hledání se zpřesní';
    box.innerHTML = `<div style="font-size:12px; color:#64748b; margin-bottom:6px;">${info}</div>
        <div style="overflow-x:auto;"><table>
            <tr><th style="text-align:left;">Hráč</th><th>Tým</th><th>Poz.</th><th>OVR</th><th>Z</th><th>G</th><th>A</th><th>B</th><th title="Body v play-off">PO</th><th></th></tr>
            ${rows}</table></div>
        <div style="font-size:11px; color:#94a3b8; margin-top:6px;">Klikni na jméno pro detail (celá kariéra). B = body v základní části, PO = body v play-off.</div>`;
}

// z vyhledávání rovnou do trade panelu: předvybere tým, požadovaného hráče i nejlevnějšího vlastního hráče, kterého AI přijme
function openTradeWith(encTeam, encPlayer) {
    const tn = decodeURIComponent(encTeam), pn = decodeURIComponent(encPlayer);
    if (!db.enableTrades || db.playoffStage !== 0 || !db.teams[tn]) return;
    showTradeMarket();
    const partnerSel = document.getElementById('trade-partner-select');
    if (!partnerSel) return;
    partnerSel.value = tn;
    updateTradePartnerOptions(tn);
    const theirSel = document.getElementById('trade-their-player');
    if (theirSel) theirSel.value = pn;

    const theirP = db.teams[tn].roster.find(p => p.n === pn);
    if (theirP) {
        const mine = db.teams[db.userTeam].roster.filter(p => p.p === theirP.p);
        let best = null;
        mine.forEach(p => {
            if (evaluateTrade(p, theirP).accept && (!best || tradeValue(p) < tradeValue(best))) best = p;
        });
        if (!best) best = mine.slice().sort((a, b) => tradeValue(b) - tradeValue(a))[0];
        const mySel = document.getElementById('trade-my-player');
        if (best && mySel) mySel.value = best.n;
    }
    updateTradeVerdict();
}

// ===== OCENĚNÍ SEZÓNY =====
// Uděluje se na konci každé sezóny zvlášť v Extralize a v 1. lize podle základní části.
// Ukládá se do historie (db.history.awards) a zobrazuje se na profilu hráče.
const AWARD_DEFS = [
    { k: "scorer", icon: "🥅", name: "Nejlepší střelec",  short: "Střelec",  unit: " G" },
    { k: "assist", icon: "🎯", name: "Nejlepší nahrávač", short: "Nahrávač", unit: " A" },
    { k: "points", icon: "⭐", name: "Nejlepší bodovač",  short: "Bodovač",  unit: " b." },
    { k: "goalie", icon: "🧤", name: "Nejlepší brankář",  short: "Brankář",  unit: " %" },
    { k: "mvp",    icon: "🏅", name: "MVP sezóny",        short: "MVP",      unit: "× MVP" }
];

function computeSeasonAwards() {
    const stats = collectSeasonStats();
    const out = {};
    [1, 2].forEach(lNum => {
        const rounds = getLeagueTeams(lNum).length - 1;
        const minGp = Math.max(3, Math.round(rounds * 0.6)); // brankář musí odchytat aspoň 60 % kol
        const pool = stats.filter(s => db.teams[s.tn] && db.teams[s.tn].league === lNum);
        const sk = pool.filter(s => s.p !== "G");
        const gk = pool.filter(s => s.p === "G");
        const first = (arr, cmp) => arr.length ? arr.slice().sort(cmp)[0] : null;
        const mk = (s, v) => s ? { n: s.n, tn: s.tn, t: s.t, v: v } : null;
        const byName = (x, y) => x.n.localeCompare(y.n);

        const res = {};
        const sc = first(sk.filter(s => s.g > 0), (x, y) => y.g - x.g || (y.g + y.a) - (x.g + x.a) || x.gp - y.gp || byName(x, y));
        if (sc) res.scorer = mk(sc, sc.g);
        const as = first(sk.filter(s => s.a > 0), (x, y) => y.a - x.a || (y.g + y.a) - (x.g + x.a) || x.gp - y.gp || byName(x, y));
        if (as) res.assist = mk(as, as.a);
        const pt = first(sk.filter(s => s.g + s.a > 0), (x, y) => (y.g + y.a) - (x.g + x.a) || y.g - x.g || x.gp - y.gp || byName(x, y));
        if (pt) res.points = mk(pt, pt.g + pt.a);
        const sv = (s) => s.sh > 0 ? (1 - s.ga / s.sh) * 100 : 0;
        const go = first(gk.filter(s => s.gp >= minGp && s.sh > 0), (x, y) => sv(y) - sv(x) || y.so - x.so || byName(x, y));
        if (go) res.goalie = mk(go, Math.round(sv(go) * 10) / 10);
        const mv = first(pool.filter(s => s.mvp > 0), (x, y) => y.mvp - x.mvp || (y.g + y.a) - (x.g + x.a) || byName(x, y));
        if (mv) res.mvp = mk(mv, mv.mvp);
        out[lNum] = res;
    });
    return out;
}

// uložená ocenění + právě dohraná sezóna, která ještě není archivovaná
function awardsForSeasons() {
    const res = Object.assign({}, (db.history && db.history.awards) || {});
    if (db.finaleWinner && !res[db.seasonYear]) res[db.seasonYear] = computeSeasonAwards();
    return res;
}

// { scorer: [2026, 2028], points: [2027] ... }
function getPlayerAwards(name) {
    const out = {};
    const all = awardsForSeasons();
    Object.keys(all).forEach(y => {
        [1, 2].forEach(l => {
            const a = all[y] && all[y][l];
            if (!a) return;
            AWARD_DEFS.forEach(d => {
                if (a[d.k] && a[d.k].n === name) (out[d.k] = out[d.k] || []).push(Number(y));
            });
        });
    });
    return out;
}

function awardChipsHtml(name) {
    const aw = getPlayerAwards(name);
    const chips = AWARD_DEFS.filter(d => aw[d.k]).map(d =>
        `<span title="${aw[d.k].sort().join(', ')}" style="display:inline-block; background:#fef9c3; border:1px solid #fde047; border-radius:14px; padding:2px 9px; margin:2px 3px 2px 0; font-size:12px; font-weight:700;">${d.icon} ${d.short} ${aw[d.k].length}×</span>`);
    return chips.length ? chips.join("") : "—";
}

function countPlayerAwards(name) {
    const aw = getPlayerAwards(name);
    return Object.values(aw).reduce((s, arr) => s + arr.length, 0);
}

// hráči s nejvíc oceněními (pro Síň slávy)
function awardLeaders(allPlayers, limit) {
    const total = {};
    const all = awardsForSeasons();
    Object.keys(all).forEach(y => [1, 2].forEach(l => {
        const a = all[y] && all[y][l];
        if (!a) return;
        AWARD_DEFS.forEach(d => { if (a[d.k]) total[a[d.k].n] = (total[a[d.k].n] || 0) + 1; });
    }));
    return Object.entries(total)
        .map(([n, v]) => ({ p: allPlayers.find(p => p.n === n), v }))
        .filter(x => x.p)
        .sort((a, b) => b.v - a.v)
        .slice(0, limit || 5);
}

function fmtAwardValue(def, v) {
    return def.k === "goalie" ? v.toFixed(1) + " %" : (def.k === "mvp" ? v + "× MVP" : v + def.unit);
}

// historie ocenění po sezónách (obrazovka HISTORIE)
function awardsHistoryHtml() {
    const all = awardsForSeasons();
    const years = Object.keys(all).map(Number).sort((a, b) => b - a);
    const head = `<br><h2 style="text-align:center;">Ocenění sezón 🏅</h2>`;
    if (!years.length) return head + `<p style="text-align:center; color:#64748b; font-size:13px;">Zatím žádná – ocenění se udělují na konci každé sezóny.</p>`;
    const cell = (def, w) => {
        if (!w) return `<td style="color:#94a3b8;">—</td>`;
        const logo = db.teams[w.tn] ? db.teams[w.tn].logo : "";
        const mine = w.tn === db.userTeam;
        return `<td style="${mine ? 'background:#fef9c3;' : ''}">${plink(w.n, logo)}<br><small style="color:#64748b;">${fmtAwardValue(def, w.v)}</small></td>`;
    };
    let rows = "";
    years.forEach(y => {
        [1, 2].forEach(l => {

            if (!a) return;
            const pending = (y === db.seasonYear && !(db.history.awards && db.history.awards[y])) ? ' <small>(právě dohraná)</small>' : '';
            rows += `<tr><td>${y}${pending}</td><td>${l === 1 ? 'Extraliga' : '1. liga'}</td>${AWARD_DEFS.map(d => cell(d, a[d.k])).join("")}</tr>`;
        });

    return head + `<div style="overflow-x:auto;"><table>
        <tr><th>Sezóna</th><th>Liga</th>${AWARD_DEFS.map(d => `<th>${d.icon} ${d.short}</th>`).join("")}</tr>${rows}</table></div>`;
}

// ===== ONLINE SOUBOJ (hostitel posílá odkaz, soupeř ho otevře a hraje se přímo mezi vámi – PeerJS) =====
// Zápasy se počítají u hostitele a výsledek se pošle soupeři. Neovlivňuje ligu, statistiky ani energii.
let olPeer = null, olConn = null, olIsHost = true, olLen = 3, olS = null;

function olReset() { olS = { opp: null, hw: 0, gw: 0, games: [], msg: "", link: "", done: false, busy: false }; }
function olNeed() { return Math.ceil(olLen / 2); }
function olRec() { try { return JSON.parse(localStorage.getItem('hokejbal_online_rec')) || { w: 0, l: 0 }; } catch (e) { return { w: 0, l: 0 }; } }

function olSnap() {
    ensureCaptain(db.userTeam);
    const t = db.teams[db.userTeam];
    return {
        team: db.userTeam, logo: t.logo, abbr: t.abbr,
        roster: t.roster.slice(0, 6).map(p => ({ n: p.n, p: p.p, ovr: p.ovr, energy: p.energy, cap: p.cap }))
    };
}

function olPower(S) {
    let o = 0, d = S.roster[0].ovr;
    S.roster.forEach((p, i) => {
        if (i === 1 || i === 2) d += getEffectiveOvr(p, i);
        if (i >= 3 && i <= 5) o += getEffectiveOvr(p, i);
    });
    return { off: o / 3, def: d / 3 };
}

function olPick(S, exclude) {
    const c = [1, 2, 3, 4, 5].map(i => ({ p: S.roster[i], w: (i >= 3 ? 3 : 1) * Math.max(1, getEffectiveOvr(S.roster[i], i) - 40) }))
        .filter(x => x.p.n !== exclude);
    let r = Math.random() * c.reduce((s, x) => s + x.w, 0);
    for (const x of c) { r -= x.w; if (r <= 0) return x.p; }
    return c[c.length - 1].p;
}

function olSim(A, B) {
    const a = olPower(A), b = olPower(B);
    const sh = (P) => Math.max(8, Math.floor(P.off / 4.5 + Math.floor(Math.random() * 12)));
    const gl = (n, o, d) => { let g = 0; const c = (o / (d * 1.08)) * 0.092; for (let i = 0; i < n; i++) if (Math.random() < c) g++; return g; };
    let ga = gl(sh(a), a.off, b.def), gb = gl(sh(b), b.off, a.def), ot = "", extra = null;
    const baseA = ga, baseB = gb;
    if (ga === gb) {
        const rA = a.off / b.def, rB = b.off / a.def;
        if (Math.random() < rA / (rA + rB)) { ga++; extra = 'h'; } else { gb++; extra = 'g'; }
        ot = Math.random() < 0.55 ? "OT" : "NÁJ";
    }
    const goals = [];
    const add = (s, S, n) => { for (let i = 0; i < n; i++) { const sc = olPick(S); goals.push({ s, m: 1 + Math.floor(Math.random() * 60), n: sc.n, as: olPick(S, sc.n).n }); } };
    add('h', A, baseA); add('g', B, baseB);
    goals.sort((x, y) => x.m - y.m);
    if (extra) {
        const S = extra === 'h' ? A : B;
        if (ot === "OT") { const sc = olPick(S); goals.push({ s: extra, m: 61, n: sc.n, as: olPick(S, sc.n).n }); }
        else goals.push({ s: extra, m: 65, n: null, as: null });
    }
    return { hg: ga, gg: gb, ot, goals };
}

function showOnline(joinId) {
    if (typeof Peer === 'undefined') {
        alert("Online režim se nepodařilo načíst (chybí připojení k internetu).");
        return;
    }
    olLeave(true); olReset(); olIsHost = !joinId;
    document.getElementById('app').innerHTML = `<div style="max-width:900px; margin:0 auto; padding:20px;">
        <button class="btn" style="width:160px;" onclick="olLeave()">← ZPĚT</button>
        <div id="olview"></div></div>`;
    olPeer = new Peer();
    olPeer.on('error', e => { olS.msg = "Chyba spojení: " + (e.type || e); olRender(); });
    if (joinId) {
        olS.msg = "Připojuji se k hostiteli…";
        olPeer.on('open', () => olSetup(olPeer.connect(joinId, { reliable: true })));
    } else {
        olS.msg = "Vytvářím místnost…";
        olPeer.on('open', id => { olS.link = location.href.split('#')[0] + '#online=' + id; olS.msg = ""; olRender(); });
        olPeer.on('connection', c => { if (olConn) { c.close(); return; } olSetup(c); });
    }
    olRender();
}

function olSetup(c) {
    olConn = c;
    const onOpen = () => {
        olS.msg = "Spojeno ✅";
        if (!olIsHost) c.send({ t: 'hello', snap: olSnap() });
        olRender();
    };
    if (c.open) onOpen(); else c.on('open', onOpen);
    c.on('data', olOnData);
    c.on('close', () => { olConn = null; olS.busy = false; olS.msg = "Soupeř se odpojil."; olRender(); });
}

function olOnData(m) {
    if (m.t === 'hello') { olS.opp = m.snap; olConn.send({ t: 'hello2', snap: olSnap(), len: olLen }); }
    else if (m.t === 'hello2') { olS.opp = m.snap; olLen = m.len; }
    else if (m.t === 'req') { olConn.send({ t: 'snap', snap: olSnap() }); return; }
    else if (m.t === 'snap') { olS.opp = m.snap; olApply(olSim(olSnap(), olS.opp)); olConn.send({ t: 'result', res: olS.games[olS.games.length - 1] }); }
    else if (m.t === 'result') olApply(m.res);
    else if (m.t === 'newseries') { olLen = m.len; olS.hw = 0; olS.gw = 0; olS.games = []; olS.done = false; }
    olRender();
}

function olApply(res) {
    olS.games.push(res);
    if (res.hg > res.gg) olS.hw++; else olS.gw++;
    olS.busy = false;
    const need = olNeed();
    if (olS.hw >= need || olS.gw >= need) {
        olS.done = true;
        const won = olIsHost ? olS.hw >= need : olS.gw >= need;
        const r = olRec(); if (won) r.w++; else r.l++;
        try { localStorage.setItem('hokejbal_online_rec', JSON.stringify(r)); } catch (e) {}
    }
}

function olPlay() {
    if (!olConn || olS.busy || olS.done) return;
    olS.busy = true; olConn.send({ t: 'req' }); olRender();
}

function olNewSeries() {
    if (!olConn) return;
    olS.hw = 0; olS.gw = 0; olS.games = []; olS.done = false;
    olConn.send({ t: 'newseries', len: olLen }); olRender();
}

function olSetLen(v) {
    olLen = Number(v);
    if (olConn && olIsHost) olConn.send({ t: 'hello2', snap: olSnap(), len: olLen });
    olRender();
}

function olLeave(silent) {
    try { if (olConn) olConn.close(); } catch (e) {}
    try { if (olPeer) olPeer.destroy(); } catch (e) {}
    olConn = null; olPeer = null;
    if (silent) return;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    render();
}

function olRender() {
    const v = document.getElementById('olview');
    if (!v || !olS) return;
    const me = olSnap(), opp = olS.opp, rec = olRec(), need = olNeed();
    const myW = olIsHost ? olS.hw : olS.gw, opW = olIsHost ? olS.gw : olS.hw;
    const box = (s, label, sc) => s
        ? `<div style="text-align:center; flex:1; min-width:140px;"><img src="${s.logo}" style="width:80px;"><h3 style="margin:6px 0;">${s.team}</h3><small style="color:#64748b;">${label}</small><div style="font-size:44px; font-weight:800; color:#ff6600;">${sc}</div></div>`
        : `<div style="text-align:center; flex:1; min-width:140px; color:#94a3b8; padding-top:40px;">čekám na soupeře…</div>`;
    let body = `<h2 style="text-align:center;">ONLINE SOUBOJ 🌐</h2>
        <p style="text-align:center; color:#64748b; font-size:12px; margin-top:-5px;">Hraje se jen mezi vámi, nemá vliv na ligu, statistiky ani energii hráčů. Série na ${need} vítězné zápasy.</p>`;
    if (olS.msg) body += `<p style="text-align:center; font-weight:bold; color:#2563eb;">${olS.msg}</p>`;

    if (olIsHost && !olConn) {
        body += `<div style="text-align:center; margin:12px 0;">
            Počet zápasů v sérii:
            <select onchange="olSetLen(this.value)"><option value="1" ${olLen === 1 ? 'selected' : ''}>1 zápas</option><option value="3" ${olLen === 3 ? 'selected' : ''}>nejlepší ze 3</option><option value="5" ${olLen === 5 ? 'selected' : ''}>nejlepší z 5</option></select></div>`;
        if (olS.link) body += `<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px; text-align:center;">
            <b>Pošli tenhle odkaz bratrovi:</b><br>
            <input type="text" readonly value="${olS.link}" style="width:90%; margin:8px 0; padding:8px;" onclick="this.select()"><br>
            <button class="btn" style="width:200px; background:#2563eb; color:#fff;" onclick="navigator.clipboard && navigator.clipboard.writeText('${olS.link}'); this.innerText='Zkopírováno ✔'">KOPÍROVAT ODKAZ</button>
            <p style="font-size:12px; color:#64748b; margin:8px 0 0 0;">Nech tuhle stránku otevřenou, než se připojí. ${location.protocol === 'file:' ? '<b style="color:#dc2626;">Pozor: hra je otevřená ze souboru v počítači, takže odkaz u bratra nezná hru. Nahraj ji nejdřív na web (např. GitHub Pages nebo Netlify).</b>' : ''}</p></div>`;
    } else {
        body += `<div style="display:flex; gap:15px; align-items:center; margin:15px 0;">${box(me, "TY", myW)}<div style="font-size:28px; font-weight:800;">:</div>${box(opp, "SOUPEŘ", opW)}</div>`;
        if (olS.done) {
            const won = myW > opW;
            body += `<h2 style="text-align:center; color:${won ? '#16a34a' : '#dc2626'};">${won ? '🏆 Vyhrál jsi sérii!' : '😞 Série prohraná.'}</h2>`;
            if (olIsHost) body += `<div style="text-align:center;"><button class="btn" style="width:240px; background:#22c55e; color:#fff;" onclick="olNewSeries()">NOVÁ SÉRIE 🔄</button></div>`;
            else body += `<p style="text-align:center; color:#64748b;">Čeká se, jestli hostitel začne novou sérii.</p>`;
        } else if (olIsHost) {
            body += `<div style="text-align:center;"><button class="btn" style="width:260px; background:#ff6600; color:#fff;" ${olS.busy || !olConn || !opp ? 'disabled' : ''} onclick="olPlay()">${olS.busy ? 'Počítám…' : 'ODEHRÁT ZÁPAS č. ' + (olS.games.length + 1)}</button></div>`;
        } else {
            body += `<p style="text-align:center; color:#64748b;">Zápas spouští hostitel. Před každým zápasem se použije tvoje aktuální sestava.</p>`;
        }
        body += olS.games.slice().reverse().map((g, i) => {
            const n = olS.games.length - i;
            const my = olIsHost ? g.hg : g.gg, op = olIsHost ? g.gg : g.hg;
            const sideTeam = (s) => ((s === 'h') === olIsHost ? me.abbr : (opp ? opp.abbr : '?'));
            const lines = g.goals.map(x => `<div style="font-size:13px; padding:2px 0; ${(x.s === 'h') === olIsHost ? 'color:#16a34a;' : 'color:#dc2626;'}">${x.n === null ? '🎯 nájezdy' : (x.m > 60 ? 'OT' : x.m + '.') + ' ' + x.n + (x.as ? ' <span style="color:#64748b;">(' + x.as + ')</span>' : '')} – ${sideTeam(x.s)}</div>`).join("");
            return `<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px; margin:10px 0;">
                <b>Zápas ${n}: ${my}:${op}${g.ot ? ' (' + g.ot + ')' : ''}</b> ${my > op ? '✅' : '❌'}${lines}</div>`;
        }).join("");
    }
    body += `<p style="text-align:center; color:#64748b; font-size:12px; margin-top:20px;">Tvoje série celkem: ${rec.w} výher, ${rec.l} proher</p>`;
    v.innerHTML = body;
}

// otevření odkazu od kamaráda (#online=...): po výběru týmu se rovnou připojí
function olJoinFromHash() {
    const m = location.hash.match(/^#online=([\w-]+)/);
    if (m && db.userTeam) showOnline(m[1]);
}

render();
olJoinFromHash();
</script>
</body>
</html>
